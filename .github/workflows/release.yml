name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 30
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
          cache: true
          cache-dependency-path: '**/*.csproj'
      - name: Resolve version
        id: version
        shell: pwsh
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          $version = if ($env:GITHUB_REF_TYPE -eq 'tag') { $env:REF_NAME -replace '^v', '' } else { '1.0.0' }
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw "Invalid version tag" }
          "version=$version" >> $env:GITHUB_OUTPUT
      - run: dotnet restore Streamboard.Companion.sln
      - run: dotnet build Streamboard.Companion.sln --configuration Release --no-restore -p:Version=${{ steps.version.outputs.version }}
      - run: dotnet test Streamboard.Companion.sln --configuration Release --no-build
      - name: Publish portable application
        run: >-
          dotnet publish src/Streamboard.Companion.Windows/Streamboard.Companion.Windows.csproj
          --configuration Release --runtime win-x64 --self-contained true
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true
          -p:DebugType=None -p:Version=${{ steps.version.outputs.version }}
          --output artifacts/publish
      - name: Sign application when configured
        if: vars.WINDOWS_SIGNING_ENABLED == 'true' && github.ref_type == 'tag'
        shell: pwsh
        env:
          SIGNING_PFX: ${{ secrets.WINDOWS_SIGNING_PFX_BASE64 }}
          SIGNING_PASSWORD: ${{ secrets.WINDOWS_SIGNING_PFX_PASSWORD }}
        run: |
          $pfx = Join-Path $env:RUNNER_TEMP signing.pfx
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:SIGNING_PFX))
          & signtool sign /fd SHA256 /f $pfx /p $env:SIGNING_PASSWORD /tr http://timestamp.digicert.com /td SHA256 artifacts/publish/Streamboard.Companion.exe
          Remove-Item -LiteralPath $pfx -Force
      - name: Package portable ZIP
        shell: pwsh
        run: |
          $asset = "artifacts/Streamboard.Companion-${{ steps.version.outputs.version }}-win-x64-portable.zip"
          Compress-Archive -Path artifacts/publish/* -DestinationPath $asset -CompressionLevel Optimal
      - name: Build installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path -LiteralPath $iscc)) { throw "Inno Setup 6 is unavailable" }
          & $iscc "/DAppVersion=${{ steps.version.outputs.version }}" installer/Streamboard.Companion.iss
      - name: Sign installer when configured
        if: vars.WINDOWS_SIGNING_ENABLED == 'true' && github.ref_type == 'tag'
        shell: pwsh
        env:
          SIGNING_PFX: ${{ secrets.WINDOWS_SIGNING_PFX_BASE64 }}
          SIGNING_PASSWORD: ${{ secrets.WINDOWS_SIGNING_PFX_PASSWORD }}
        run: |
          $pfx = Join-Path $env:RUNNER_TEMP signing.pfx
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:SIGNING_PFX))
          & signtool sign /fd SHA256 /f $pfx /p $env:SIGNING_PASSWORD /tr http://timestamp.digicert.com /td SHA256 "artifacts/Streamboard.Companion-Setup-${{ steps.version.outputs.version }}.exe"
          Remove-Item -LiteralPath $pfx -Force
      - name: Generate SPDX SBOM
        shell: pwsh
        run: |
          dotnet tool install --global Microsoft.Sbom.DotNetTool
          sbom-tool generate -b artifacts/publish -bc . -pn Streamboard.Companion -pv "${{ steps.version.outputs.version }}" -ps Webvibecoding -nsb https://github.com/webvibecoding/streamboard-companion
          Copy-Item artifacts/publish/_manifest/spdx_2.2/manifest.spdx.json "artifacts/Streamboard.Companion-${{ steps.version.outputs.version }}-sbom.spdx.json"
          Remove-Item -LiteralPath artifacts/publish/_manifest -Recurse -Force
      - name: Generate checksums
        shell: pwsh
        run: |
          $files = Get-ChildItem artifacts -File | Where-Object { $_.Name -ne 'SHA256SUMS.txt' } | Sort-Object Name
          $lines = foreach ($file in $files) {
            $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $file.FullName).Hash.ToLowerInvariant()
            "$hash  $($file.Name)"
          }
          Set-Content -LiteralPath artifacts/SHA256SUMS.txt -Value $lines -Encoding utf8NoBOM
      - uses: actions/upload-artifact@v4
        with:
          name: streamboard-companion-${{ steps.version.outputs.version }}-win-x64
          path: |
            artifacts/*.zip
            artifacts/*.exe
            artifacts/*.spdx.json
            artifacts/SHA256SUMS.txt
          if-no-files-found: error

  draft:
    if: github.ref_type == 'tag'
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: streamboard-companion-${{ needs.release.outputs.version }}-win-x64
          path: artifacts
      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          name: Streamboard Companion ${{ needs.release.outputs.version }}
          body_path: RELEASE_NOTES.md
          files: |
            artifacts/*.zip
            artifacts/*.exe
            artifacts/*.spdx.json
            artifacts/SHA256SUMS.txt
          fail_on_unmatched_files: true
